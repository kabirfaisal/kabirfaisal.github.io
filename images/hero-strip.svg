<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 90" width="1120" height="90">
  <!-- Decorative home-page strip: heartbeat (vital signs) → neural network → ranked suggestions -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".07" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".93" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges"><rect width="1120" height="90" fill="url(#fade)"/></mask>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6edcbd"/>
      <stop offset="1" stop-color="#a497ff"/>
    </linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="770" y1="0" x2="1100" y2="0">
      <stop offset="0" stop-color="#a497ff"/>
      <stop offset="1" stop-color="#f5b85e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ecg { fill: none; stroke: #6edcbd; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; opacity: .85; }
      .pulse { fill: none; stroke: #effff9; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
               stroke-dasharray: 70 1100; stroke-dashoffset: 70; animation: travel 3.4s linear infinite; }
      .edge { stroke: #ffffff; stroke-opacity: .14; stroke-width: 1; }
      .flow { fill: none; stroke: #a497ff; stroke-opacity: .5; stroke-width: 1.5; stroke-dasharray: 4 5;
              animation: dash 1.6s linear infinite; }
      .n { fill: url(#node); stroke: #ffffff; stroke-opacity: .55; stroke-width: 1; animation: twinkle 2.8s ease-in-out infinite; }
      .bar { fill: url(#bars); transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 2.6s ease-in-out infinite; }
      @keyframes travel  { to { stroke-dashoffset: -1000; } }
      @keyframes dash    { to { stroke-dashoffset: -18; } }
      @keyframes twinkle { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes breathe { 0%, 100% { transform: scaleY(.82); } 50% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .pulse { display: none; }
        .bar { transform: none; }
      }
    </style>
  </defs>

  <g mask="url(#edges)">
    <!-- faint baseline through the whole strip -->
    <line x1="0" y1="50" x2="1120" y2="50" stroke="#ffffff" stroke-opacity=".07" stroke-dasharray="2 7"/>

    <!-- 1. Heartbeat: vital signs -->
    <path id="ecg" class="ecg" d="M0 50 L40 50 Q48 43 56 50 L64 50 L68 55 L74 14 L80 68 L85 50 L98 50 Q110 38 122 50
      L170 50 Q178 43 186 50 L194 50 L198 55 L204 14 L210 68 L215 50 L228 50 Q240 38 252 50
      L300 50 Q308 43 316 50 L324 50 L328 55 L334 14 L340 68 L345 50 L358 50 Q370 38 382 50 L440 50"/>
    <path class="pulse" pathLength="1000" filter="url(#glow)" d="M0 50 L40 50 Q48 43 56 50 L64 50 L68 55 L74 14 L80 68 L85 50 L98 50 Q110 38 122 50
      L170 50 Q178 43 186 50 L194 50 L198 55 L204 14 L210 68 L215 50 L228 50 Q240 38 252 50
      L300 50 Q308 43 316 50 L324 50 L328 55 L334 14 L340 68 L345 50 L358 50 Q370 38 382 50 L440 50"/>

    <!-- 2. Neural network: multimodal fusion -->
    <g class="edge">
      <line x1="440" y1="50" x2="520" y2="22"/><line x1="440" y1="50" x2="520" y2="50"/><line x1="440" y1="50" x2="520" y2="78"/>
      <line x1="520" y1="22" x2="610" y2="14"/><line x1="520" y1="22" x2="610" y2="38"/><line x1="520" y1="22" x2="610" y2="62"/><line x1="520" y1="22" x2="610" y2="86"/>
      <line x1="520" y1="50" x2="610" y2="14"/><line x1="520" y1="50" x2="610" y2="38"/><line x1="520" y1="50" x2="610" y2="62"/><line x1="520" y1="50" x2="610" y2="86"/>
      <line x1="520" y1="78" x2="610" y2="14"/><line x1="520" y1="78" x2="610" y2="38"/><line x1="520" y1="78" x2="610" y2="62"/><line x1="520" y1="78" x2="610" y2="86"/>
      <line x1="610" y1="14" x2="700" y2="32"/><line x1="610" y1="38" x2="700" y2="32"/><line x1="610" y1="62" x2="700" y2="32"/><line x1="610" y1="86" x2="700" y2="32"/>
      <line x1="610" y1="14" x2="700" y2="68"/><line x1="610" y1="38" x2="700" y2="68"/><line x1="610" y1="62" x2="700" y2="68"/><line x1="610" y1="86" x2="700" y2="68"/>
    </g>
    <circle class="n" cx="440" cy="50" r="6" style="animation-delay:0s"/>
    <circle class="n" cx="520" cy="22" r="5" style="animation-delay:.3s"/>
    <circle class="n" cx="520" cy="50" r="5" style="animation-delay:.6s"/>
    <circle class="n" cx="520" cy="78" r="5" style="animation-delay:.9s"/>
    <circle class="n" cx="610" cy="14" r="4.5" style="animation-delay:1.2s"/>
    <circle class="n" cx="610" cy="38" r="4.5" style="animation-delay:1.5s"/>
    <circle class="n" cx="610" cy="62" r="4.5" style="animation-delay:1.8s"/>
    <circle class="n" cx="610" cy="86" r="4.5" style="animation-delay:2.1s"/>
    <circle class="n" cx="700" cy="32" r="5.5" style="animation-delay:2.4s"/>
    <circle class="n" cx="700" cy="68" r="5.5" style="animation-delay:2.7s"/>

    <!-- links into the ranking -->
    <path class="flow" d="M706 32 C735 32 740 40 762 40"/>
    <path class="flow" d="M706 68 C735 68 740 60 762 60"/>

    <!-- 3. Ranked suggestions: tallest = most likely -->
    <g>
      <rect class="bar" x="770"  y="20" width="10" height="58" rx="3" style="animation-delay:0s"/>
      <rect class="bar" x="790"  y="26" width="10" height="52" rx="3" style="animation-delay:.12s"/>
      <rect class="bar" x="810"  y="31" width="10" height="47" rx="3" style="animation-delay:.24s"/>
      <rect class="bar" x="830"  y="35" width="10" height="43" rx="3" style="animation-delay:.36s"/>
      <rect class="bar" x="850"  y="40" width="10" height="38" rx="3" style="animation-delay:.48s"/>
      <rect class="bar" x="870"  y="43" width="10" height="35" rx="3" style="animation-delay:.6s"/>
      <rect class="bar" x="890"  y="47" width="10" height="31" rx="3" style="animation-delay:.72s"/>
      <rect class="bar" x="910"  y="50" width="10" height="28" rx="3" style="animation-delay:.84s"/>
      <rect class="bar" x="930"  y="53" width="10" height="25" rx="3" style="animation-delay:.96s"/>
      <rect class="bar" x="950"  y="56" width="10" height="22" rx="3" style="animation-delay:1.08s"/>
      <rect class="bar" x="970"  y="59" width="10" height="19" rx="3" style="animation-delay:1.2s"/>
      <rect class="bar" x="990"  y="61" width="10" height="17" rx="3" style="animation-delay:1.32s"/>
      <rect class="bar" x="1010" y="63" width="10" height="15" rx="3" style="animation-delay:1.44s"/>
      <rect class="bar" x="1030" y="65" width="10" height="13" rx="3" style="animation-delay:1.56s"/>
      <rect class="bar" x="1050" y="67" width="10" height="11" rx="3" style="animation-delay:1.68s"/>
      <rect class="bar" x="1070" y="69" width="10" height="9"  rx="3" style="animation-delay:1.8s"/>
      <rect class="bar" x="1090" y="70" width="10" height="8"  rx="3" style="animation-delay:1.92s"/>
    </g>
  </g>
</svg>
